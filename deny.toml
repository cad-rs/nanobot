# What this repository may depend on (`cargo deny check`, run by CI). The
# framework is MIT and free for commercial use, so nothing in the
# dependency tree may require more of a product than a notice.

[graph]
# Every platform the workspace builds for.
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
]

[licenses]
confidence-threshold = 0.9
# No copyleft beyond MPL-2.0, whose terms apply file by file.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "OFL-1.1",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Pinned by commit in Cargo.lock; see the root Cargo.toml for why each is here.
allow-git = [
    "https://github.com/gfx-rs/wgpu",
    "https://github.com/longbridge/gpui-fast",
    "https://github.com/zed-industries/async-process.git",
    "https://github.com/zed-industries/async-task.git",
    "https://github.com/zed-industries/calloop",
    "https://github.com/zed-industries/font-kit",
    "https://github.com/zed-industries/khronos-egl",
    "https://github.com/zed-industries/scap",
    "https://github.com/zed-industries/windows-capture.git",
    "https://github.com/zed-industries/xim-rs.git",
]
