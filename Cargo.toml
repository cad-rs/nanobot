[workspace]
resolver = "2"
members = [
    "crates/nanobot-cordis",
    "crates/nanobot-session",
    "crates/nanobot-agent",
    "crates/nanobot-tools",
    "crates/nanobot-skills",
    "crates/nanobot-llm",
    "crates/nanobot-boot",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Proprietary"
repository = "https://github.com/cad-rs/nanobot"

[workspace.dependencies]
# Internal crates (path + version dual declaration so member crates can be
# published to crates.io directly).
nanobot-cordis = { path = "crates/nanobot-cordis", version = "0.1.0" }
nanobot-llm = { path = "crates/nanobot-llm", version = "0.1.0" }
nanobot-session = { path = "crates/nanobot-session", version = "0.1.0" }
nanobot-skills = { path = "crates/nanobot-skills", version = "0.1.0" }
nanobot-tools = { path = "crates/nanobot-tools", version = "0.1.0" }
nanobot-agent = { path = "crates/nanobot-agent", version = "0.1.0" }
nanobot-boot = { path = "crates/nanobot-boot", version = "0.1.0" }

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
crc32fast = "1.5"
futures-executor = "0.3"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "json"] }
eventsource-stream = { version = "0.2", default-features = false }
wasm-bindgen-futures = "0.4"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Release build tuning
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
