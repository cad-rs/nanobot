[workspace]
resolver = "2"
members = [
    # The telemetry seam is the dependency-free leaf every other kernel crate
    # sits on: instrumentation is a choice, so it must not pull a backend.
    "crates/nanobot-telemetry",
    "crates/nanobot-cordis",
    "crates/nanobot-session",
    "crates/nanobot-agent",
    "crates/nanobot-tools",
    "crates/nanobot-skills",
    "crates/nanobot-llm",
    "crates/nanobot-auth",
  "crates/nanobot-boot",
    # Shell layer (gpui / wgpu): the kernel above stays GUI-free, these do not.
    "crates/nanobot-gpu",
    "crates/nanobot-rhai",
    "crates/nanobot-ui",
]
# .vendor holds the gpui-pre re-export shims and the patched gpui-rhai that the
# [patch.crates-io] table at the end of this file points at; without the
# exclusion cargo would absorb them as members of THIS workspace.
exclude = [".vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cad-rs/nanobot"

[workspace.dependencies]
# Internal crates (path + version dual declaration so member crates can be
# published to crates.io directly).
nanobot-telemetry = { path = "crates/nanobot-telemetry", version = "0.1.0" }
nanobot-cordis = { path = "crates/nanobot-cordis", version = "0.1.0" }
nanobot-llm = { path = "crates/nanobot-llm", version = "0.1.0" }
nanobot-session = { path = "crates/nanobot-session", version = "0.1.0" }
nanobot-skills = { path = "crates/nanobot-skills", version = "0.1.0" }
nanobot-tools = { path = "crates/nanobot-tools", version = "0.1.0" }
nanobot-agent = { path = "crates/nanobot-agent", version = "0.1.0" }
nanobot-auth = { path = "crates/nanobot-auth", version = "0.1.0" }
nanobot-boot = { path = "crates/nanobot-boot", version = "0.1.0" }
nanobot-gpu = { path = "crates/nanobot-gpu", version = "0.1.0" }
nanobot-rhai = { path = "crates/nanobot-rhai", version = "0.1.0" }
nanobot-ui = { path = "crates/nanobot-ui", version = "0.1.0" }

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
uuid = { version = "1.0", features = ["v4", "serde"] }
crc32fast = "1.5"
futures-executor = "0.3"
web-time = "1"
# Offline license verification (PR E); pure Rust, no C dependency.
ed25519-dalek = { version = "2", default-features = false }
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
bytes = "1"
# `default-tls` is required for HTTPS providers: without a TLS backend the
# OpenAI-compatible adapter cannot complete a handshake at all (it fails with
# "unexpected EOF during handshake" against any https:// endpoint). On Windows
# this is schannel, on Linux OpenSSL, on macOS SecureTransport.
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "default-tls"] }
eventsource-stream = { version = "0.2", default-features = false }
wasm-bindgen-futures = "0.4"

# Shell layer: gpui frontend on gpui-fast (longbridge/gpui-fast, a performance
# fork of Zed's GPUI) — the same stack and the same pins as workbench-rs, so a
# product workspace that consumes both resolves one gpui core.
#
# Main, not the crates.io release: the web GPU viewport needs
# `WebPlatform::wgpu_context` and `WgpuDynamicTexture`, which no release
# carries yet. Every `rev` below — here, in [patch.crates-io] and in
# .vendor/gpui-pre-compat — must be the same commit, or Cargo builds two gpui
# cores whose types don't mix.
gpui = { git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4" }
# Web only: GPUI's own wgpu context (`WgpuContext` / `WgpuDynamicTexture`),
# which the web GPU viewport renders on, and the concrete web platform that
# hands that context out.
gpui-wgpu = { package = "gpui_wgpu", git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4" }
gpui-web = { package = "gpui_web", git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4", default-features = false }
# The platform layer an application is started on. The shell crates do not
# depend on it (the product owns the application); the examples do. No default
# features: the default `multithreaded` needs wasm threads.
gpui-platform = { package = "gpui_platform", git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4", default-features = false, features = [
    "font-kit",
    "x11",
    "wayland",
] }
# GPUI Kit's component layer, from crates.io. It is built on the `gpui-pre`
# =0.3.11 snapshot, which [patch.crates-io] points at gpui-fast.
gpui-component = "0.9.0"
# Rhai script views. Resolves to the vendored copy (see [patch.crates-io]),
# whose `gpui-pre` pin is moved to =0.3.11. 0.4.2 gates its backends behind
# features, so `gpui-pre` is named explicitly.
gpui-rhai = { version = "=0.4.2", default-features = false, features = ["gpui-pre"] }
# One wgpu for the whole workspace, at the revision gpui-fast pins: on the web
# the viewport renders on GPUI's own device and into its textures, so the types
# must be the same (that agreement is the point of nanobot-gpu).
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
# Readback presentation path (offscreen render → CPU readback → paint_image).
image = { version = "0.25", default-features = false }
anyhow = "1"
log = { version = "0.4", features = ["std"] }
# Blocking adapter/device request on the desktop, where the slot creates its
# own device (gpui renders with D3D11 / Metal there).
pollster = "0.4"
glam = { version = "0.29", features = ["serde"] }
rhai = { version = "=1.26.0", features = ["internals", "metadata", "serde"] }
# SVG rendering for script panels; `system-fonts` is what makes
# `fontdb::Database::load_system_fonts` exist (see nanobot-rhai's note).
usvg = { version = "=0.45.1", default-features = false, features = [
    "text",
    "system-fonts",
] }

[profile.dev]
opt-level = 1
# Incremental compilation accumulates ~20 GB of cache for the gpui
# tree and has filled the build volume more than once. The framework workspace
# builds the way CI does.
incremental = false

[profile.dev.package."*"]
opt-level = 2

# Release build tuning
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Single source (design NR7): this table is the same content as
# workbench-rs/Cargo.toml's own. [patch] only applies from the workspace root,
# so a product workspace consuming these crates carries the same table,
# pointing at one copy of .vendor.
[patch.crates-io]
# One gpui core for the whole graph. The registry crates that build on GPUI
# name it through the `gpui-pre-*` snapshot packages; these entries swap each
# snapshot for a re-export of gpui-fast, so their types are this workspace's.
#
# gpui-component 0.9 pins the =0.3.11 snapshot. gpui-fast's own compat crates
# still carry 0.3.9, so local copies at 0.3.11 stand in (see
# .vendor/gpui-pre-compat). Drop them once gpui-fast moves its compat crates
# to the snapshot gpui-component pins.
gpui-pre = { path = ".vendor/gpui-pre-compat/gpui-pre" }
gpui-pre-macros = { path = ".vendor/gpui-pre-compat/gpui-pre-macros" }
gpui-pre-platform = { path = ".vendor/gpui-pre-compat/gpui-pre-platform" }
gpui-pre-sum-tree = { path = ".vendor/gpui-pre-compat/gpui-pre-sum-tree" }
# gpui-rhai 0.4.2 still pins the older =0.3.9 snapshot on its default backend,
# and Cargo admits only one semver-compatible `gpui-pre` per graph. The vendored
# copy is the published 0.4.2 package with that pin moved to =0.3.11,
# gpui-fast's keystroke API and wasm32 fixes (listed at the top of its
# Cargo.toml). Its `gpui-fast` feature is no way out: it pins gpui-fast =0.1.9,
# whose keystroke API predates the core this workspace builds on. Drop the
# vendored copy once a release pins the snapshot gpui-component does, matches
# this core's keystroke API and builds for wasm.
gpui-rhai = { path = ".vendor/gpui-rhai" }

# gpui-fast's own workspace patches. Patches don't cross workspaces, so a
# git dependency on gpui-fast has to repeat them (as its wgpu demo does).
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }
