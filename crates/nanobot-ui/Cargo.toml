[package]
name = "nanobot-ui"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "nanobot gpui workbench shell: session list, session workspace, conversation stream, plan review, approval bar and the panel host that mounts product and plugin panels"

[dependencies]
# The product-infrastructure kit (storage providers, the in-app file
# picker state, OPFS): shared with the workbench framework, own submodule
# at the rcad-pro root (see product-kit/README.md). The path leaves this
# repo on purpose - the kit's home is the sibling checkout.
product-kit = { path = "../../../product-kit" }
gpui = { workspace = true }
gpui-component = { workspace = true }
# Declarative UiNode trees for script panels (mounted by the panel host).
gpui-rhai = { workspace = true }
nanobot-boot = { workspace = true }
nanobot-gpu = { workspace = true }
nanobot-rhai = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }


[dev-dependencies]
# The acceptance checks (tests/acceptance.rs) draw on gpui's headless test
# platform.
gpui = { workspace = true, features = ["test-support"] }
gpui-component = { workspace = true, features = ["test-support"] }
# examples/viewport_overlay.rs opens a real window with a viewport in it.
gpui-platform = { workspace = true }
wgpu = { workspace = true }
log = { workspace = true }
