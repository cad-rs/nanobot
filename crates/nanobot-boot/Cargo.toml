[package]
name = "nanobot-boot"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nanobot-boot: harness assembly + harness.toml identity + CLI/selfcheck + the generic project container (GUI-free)"

[lib]
crate-type = ["rlib"]

[features]
default = ["nanobot-llm-providers"]
# The HTTP provider adapter from `harness.toml [provider]`. Off, boot builds
# network-free and a `[provider]` entry falls back to the scripted adapter.
nanobot-llm-providers = ["nanobot-llm/providers"]

[dependencies]
nanobot-cordis = { workspace = true }
nanobot-llm = { workspace = true }
nanobot-session = { workspace = true }
nanobot-skills = { workspace = true }
nanobot-telemetry = { workspace = true }
nanobot-tools = { workspace = true }
nanobot-agent = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }
crc32fast = { workspace = true }
# StaticProvider reads the clock; web-time keeps wasm builds working.
web-time = { workspace = true }
# The selfcheck and the CLI smoke modes drive the agent loop headlessly
# (futures_executor::block_on); the async runtime stays the host's.
futures-executor = { workspace = true }

# wasm32-unknown-unknown has no OS entropy source. uuid's `js` feature routes
# v4 randomness through crypto.getRandomValues; without it uuid aborts the
# wasm compile. Target-scoped, so native builds keep the OS RNG path.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.0", features = ["v4", "serde", "js"] }

[dev-dependencies]
uuid = { workspace = true }
# The end-to-end session tests drive a scripted `LlmAdapter` stream.
futures-util = { workspace = true }
