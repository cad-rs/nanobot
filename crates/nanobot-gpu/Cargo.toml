[package]
name = "nanobot-gpu"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "nanobot GPU render slot: the process-wide shared wgpu device and the per-platform presentation (web texture, Windows composition surface, readback) that any harness renderer (product or plugin) draws through"

[dependencies]
gpui = { workspace = true }
# One wgpu for the whole workspace: on the web the renderer draws on GPUI's own
# device and into its textures, so the types must be the same. That agreement
# is the point of this crate.
wgpu = { workspace = true }
anyhow = { workspace = true }

# Web: GPUI's renderer is wgpu itself. The viewport renders on GPUI's device
# into a WgpuDynamicTexture, which joins the draw order as an ordinary sprite.
# Getting that context takes the concrete WebPlatform, hence gpui_web.
[target.'cfg(target_family = "wasm")'.dependencies]
gpui-wgpu = { workspace = true }
gpui-web = { workspace = true }

# Desktop: the slot creates its own wgpu device (GPUI is D3D11 on Windows and
# Metal on macOS, so there is none to share), and the fallback presentation
# reads frames back into an image.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
pollster = { workspace = true }
image = { workspace = true }

# Windows: the viewport's swap chain hangs on a DirectComposition visual in the
# GPUI window's composition. The version must match gpui_windows': the native
# surface handle is handed out as this crate's IUnknown and recovered via
# Any::downcast.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectComposition"] }
