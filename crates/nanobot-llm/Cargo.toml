[package]
name = "nanobot-llm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nanobot LLM provider adapter seam: StreamChunk/BlockAssembler vocabulary + LlmAdapter trait + OpenAI-compatible and Scripted adapters"

[lib]
crate-type = ["rlib"]

[dependencies]
bytes.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
futures-core.workspace = true
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
nanobot-telemetry = { workspace = true }

[dev-dependencies]
futures-executor = "0.3"
# The OpenAI-compatible adapter is reqwest-based, so its integration tests need
# a reactor to drive the request. Test-only.
tokio = { version = "1", features = ["rt", "net", "time"] }
