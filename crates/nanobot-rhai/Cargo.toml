[package]
name = "nanobot-rhai"
version = "0.1.0"
edition = "2021"
license.workspace = true
description = "nanobot Rhai script-plugin host: a plugin.toml manifest and a Rhai entry point that declares panels, views, commands and toolbar items"

[dependencies]
# The shared plugin host (manifest, Rhai engines, loading pipeline), consumed
# through product-kit like the rest of the shared infrastructure. This crate is
# the framework-facing name the shell already consumes.
plugin-host = { path = "../../../product-kit/crates/plugin-host" }

[dev-dependencies]
# The license-gate test wires the real ed25519 verifier.
nanobot-auth = { workspace = true }
ed25519-dalek.workspace = true
