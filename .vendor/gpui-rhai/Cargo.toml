# workbench-rs: gpui-rhai 0.4.2 as published on crates.io, with these local
# changes (search for "workbench-rs:"):
# - the gpui-pre snapshot pins move from =0.3.9 to =0.3.11 (one gpui core with
#   gpui-component 0.9; see the root Cargo.toml). The backend stays the
#   `gpui-pre` feature; upstream's `gpui-fast` feature pins gpui-fast =0.1.9,
#   whose keystroke API predates the core this workspace builds on;
# - keystrokes parse with `parse_with_os`, `KeyBindingSpec::to_gpui` and
#   `KeyBinding::load` take the App (gpui-fast's keystroke API);
# - wasm32: `web_time::Instant` replaces `std::time::Instant` (similar gets
#   `wasm32_web_time` to match), jiff gets `js`,
#   and `PrimitivePlatform` has a `Web` variant.
#
# THIS FILE IS AUTOMATICALLY GENERATED BY CARGO
#
# When uploading crates to the registry Cargo will automatically
# "normalize" Cargo.toml files for maximal compatibility
# with all versions of Cargo and also rewrite `path` dependencies
# to registry (e.g., crates.io) dependencies.
#
# If you are reading this file be aware that the original Cargo.toml
# will likely look very different (and much more reasonable).
# See Cargo.toml.orig for the original contents.

[package]
edition = "2024"
rust-version = "1.99"
name = "gpui-rhai"
version = "0.4.2"
authors = ["GPUI Rhai contributors"]
build = false
include = [
    "src/**/*.rs",
    "README.md",
    "LICENSE-*",
    "Cargo.toml",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rhai-authored declarative UI runtime for GPUI"
documentation = "https://docs.rs/gpui-rhai"
readme = "README.md"
keywords = [
    "gpui",
    "rhai",
    "gui",
    "desktop",
    "declarative",
]
categories = ["gui"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/eddix/gpui-rhai"
resolver = "2"

[features]
charts = []
default = ["gpui-pre"]
dev-reload = ["dep:notify"]
gpui-fast = [
    "dep:gpui-fast",
    "dep:gpui-fast-platform",
]
gpui-pre = [
    "dep:gpui",
    "dep:gpui_platform",
]
grain-backend = ["rhai/grain"]

[lib]
name = "gpui_rhai"
path = "src/lib.rs"

[dependencies.event-listener]
version = "5.4.2"

[dependencies.gpui]
# workbench-rs: was =0.3.9. Moved to the snapshot gpui-component 0.9 pins, so
# both resolve to the one gpui-fast core (see the root Cargo.toml).
version = "=0.3.11"
features = ["font-kit"]
optional = true
default-features = false
package = "gpui-pre"

[dependencies.gpui-fast]
version = "=0.1.9"
features = [
    "font-kit",
    "wayland",
    "x11",
]
optional = true
default-features = false
package = "gpui-fast"

[dependencies.gpui-fast-platform]
version = "=0.1.9"
features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
]
optional = true
default-features = false
package = "gpui-fast-platform"

[dependencies.gpui_platform]
# workbench-rs: was =0.3.9 (as above).
version = "=0.3.11"
features = [
    "font-kit",
    "runtime_shaders",
    "wayland",
    "x11",
]
optional = true
default-features = false
package = "gpui-pre-platform"

[dependencies.image]
version = "0.25.10"
features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
    "tiff",
]
default-features = false

[dependencies.jiff]
version = "0.2.35"
features = [
    "std",
    "tz-system",
    "tzdb-zoneinfo",
]
default-features = false

[dependencies.notify]
version = "8.2.0"
optional = true

[dependencies.pulldown-cmark]
version = "=0.13.4"
default-features = false

[dependencies.regex]
version = "=1.13.1"

[dependencies.resvg]
version = "=0.45.1"
default-features = false

[dependencies.rhai]
version = "=1.26.0"
features = [
    "internals",
    "metadata",
    "serde",
]

[dependencies.roxmltree]
version = "=0.20.0"

[dependencies.semver]
version = "1"
features = ["serde"]

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.serde_json]
version = "1"

[dependencies.similar]
version = "=3.2.0"
features = [
    "inline",
    "unicode",
]

[dependencies.syntect]
version = "=5.3.0"
features = [
    "default-syntaxes",
    "regex-fancy",
    "yaml-load",
]
default-features = false

[dependencies.thiserror]
version = "2"

[dependencies.toml]
version = "0.8"

[dependencies.unicode-segmentation]
version = "1.13.3"

[dependencies.usvg]
version = "=0.45.1"
features = ["text"]
default-features = false

# workbench-rs: `web_time::Instant` in place of `std::time::Instant`, which
# panics on wasm32-unknown-unknown (on native it is the std type itself).
[dependencies.web-time]
version = "1"

# workbench-rs: jiff reads the clock and the system time zone through JS on
# wasm32-unknown-unknown only with its `js` feature.
[target.'cfg(target_family = "wasm")'.dependencies.jiff]
version = "0.2.35"
features = ["js"]
default-features = false

# workbench-rs: diff deadlines in web_time::Instant on wasm32, as above.
[target.'cfg(target_family = "wasm")'.dependencies.similar]
version = "=3.2.0"
features = ["wasm32_web_time"]
default-features = false

[dev-dependencies.tempfile]
version = "3"

[target.'cfg(target_os = "macos")'.dependencies.objc2]
version = "0.6"

[target.'cfg(target_os = "macos")'.dependencies.objc2-app-kit]
version = "0.3"
features = [
    "std",
    "NSApplication",
    "NSDockTile",
    "NSResponder",
]
default-features = false

[target.'cfg(target_os = "macos")'.dependencies.objc2-foundation]
version = "0.3"
features = [
    "std",
    "NSBundle",
    "NSString",
]
default-features = false

[lints.clippy]
module_name_repetitions = "allow"
must_use_candidate = "allow"

[lints.clippy.all]
level = "warn"
priority = -1

[lints.clippy.pedantic]
level = "warn"
priority = -1

[lints.rust]
unsafe_code = "forbid"
