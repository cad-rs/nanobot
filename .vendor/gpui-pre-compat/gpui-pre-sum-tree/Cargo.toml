# gpui-fast's `sum_tree` standing in for gpui-pre-sum-tree =0.3.11; see
# ../gpui-pre/Cargo.toml.
[package]
name = "gpui-pre-sum-tree"
version = "0.3.11"
edition = "2024"
license = "Apache-2.0"
publish = false

[lib]
name = "sum_tree"
path = "lib.rs"
doctest = false

[features]
test-support = ["gpui_fast/test-support"]

[dependencies]
gpui_fast = { package = "sum_tree", git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4", default-features = false }
